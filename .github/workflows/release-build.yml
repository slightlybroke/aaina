name: Build release candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: frontend
    env:
      AAINA_SUPABASE_URL: ${{ vars.AAINA_SUPABASE_URL }}
      AAINA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AAINA_SUPABASE_PUBLISHABLE_KEY }}
      AAINA_API_BASE_URL: ${{ vars.AAINA_API_BASE_URL }}
      AAINA_WEB_BASE: ${{ vars.AAINA_WEB_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Validate release configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          config = {
              name: os.environ[f"AAINA_{name}"].strip()
              for name in ("SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "API_BASE_URL")
          }
          for name in ("SUPABASE_URL", "API_BASE_URL"):
              config[name] = config[name].rstrip("/")
              url = urlsplit(config[name])
              host = url.hostname or ""
              try:
                  public = ipaddress.ip_address(host).is_global
              except ValueError:
                  public = "." in host and not host.endswith((".local", ".localhost", ".test", ".example"))
              if url.scheme != "https" or not public or url.username or url.query or url.fragment:
                  raise SystemExit(f"{name} must be a public HTTPS URL")
          if not config["SUPABASE_PUBLISHABLE_KEY"].startswith("sb_publishable_"):
              raise SystemExit("Use a Supabase publishable key for public builds")
          base = os.environ["AAINA_WEB_BASE"] or "/"
          if not base.startswith("/") or not base.endswith("/") or "//" in base or "?" in base or "#" in base:
              raise SystemExit("AAINA_WEB_BASE must be / or a path such as /aaina/")
          Path(".env.release").write_text(json.dumps(config), encoding="utf-8")
          PY
          curl --fail --silent --show-error --max-time 15 "${AAINA_API_BASE_URL%/}/health"
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build web
        run: flutter build web --release --no-pub --base-href "${AAINA_WEB_BASE:-/}" --dart-define-from-file=.env.release
      - name: Sign and build Android APK
        env:
          AAINA_KEYSTORE: ${{ secrets.AAINA_KEYSTORE }}
          AAINA_STORE_PASSWORD: ${{ secrets.AAINA_STORE_PASSWORD }}
          AAINA_KEY_ALIAS: ${{ secrets.AAINA_KEY_ALIAS }}
          AAINA_KEY_PASSWORD: ${{ secrets.AAINA_KEY_PASSWORD }}
        shell: bash
        run: |
          : "${AAINA_KEYSTORE:?Set the base64 Android keystore}"
          : "${AAINA_STORE_PASSWORD:?Set the Android keystore password}"
          : "${AAINA_KEY_ALIAS:?Set the key alias}"
          : "${AAINA_KEY_PASSWORD:?Set the Android key password}"
          trap 'rm -f android/release.jks android/key.properties' EXIT
          printf '%s' "$AAINA_KEYSTORE" | base64 --decode > android/release.jks
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {"storeFile": "release.jks"}
          for name, env in {
              "storePassword": "AAINA_STORE_PASSWORD",
              "keyAlias": "AAINA_KEY_ALIAS",
              "keyPassword": "AAINA_KEY_PASSWORD",
          }.items():
              value = os.environ[env]
              if not value or any(ord(ch) < 32 or ord(ch) > 126 for ch in value):
                  raise SystemExit(f"{env} must use printable ASCII characters")
              values[name] = value.replace("\\", "\\\\").replace(" ", "\\ ")
          Path("android/key.properties").write_text(
              "".join(f"{key}={value}\n" for key, value in values.items()), encoding="ascii"
          )
          PY
          flutter build apk --release --no-pub --dart-define-from-file=.env.release
          cp build/app/outputs/flutter-apk/app-release.apk build/aaina.apk
          (cd build && sha256sum aaina.apk > aaina.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: aaina-web
          path: frontend/build/web/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aaina-android
          path: |
            frontend/build/aaina.apk
            frontend/build/aaina.apk.sha256
          if-no-files-found: error
